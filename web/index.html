<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="beavertalk app">

  <!-- Google Sign-In (web): client id for the GIS button / idToken flow. -->
  <meta name="google-signin-client_id"
        content="333511894671-mfss7vgjb3nmgl16jpo2e56bp6ne770e.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="beavertalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon. 32x32, not the generator's 16x16 default — at 16px the mascot
       is unreadable mush, and HiDPI tabs ask for 32 anyway. Browsers downscale
       to 16 themselves. Re-running `dart run flutter_launcher_icons` rewrites
       this file back to 16x16; regenerate at 32 afterwards. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>beavertalk</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Splash — Figma "Splash & logo" (160:58332). Background #181A20
    (Background/Normal/Normal, Dark) + the white BeaverTalk wordmark centered.
    Images under web/splash/img/ are generated by `flutter_native_splash:create`
    (config in pubspec.yaml); this markup is hand-kept so the file stays
    readable. The engine fires `flutter-first-frame` once Flutter has painted,
    which is when the overlay is torn down.
  -->
  <style id="splash-screen-style">
    html { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #181A20;
    }

    #splash img {
      display: block;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
  </script>
</head>
<body>
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

  <!--
    Passkeys Web SDK (corbado bundle.js, v2.4.0). Pulled in transitively by
    supabase_flutter → passkeys → passkeys_web. The web plugin's registerWith()
    checks for the global `window.PasskeyAuthenticator` at startup and calls
    window.close() (killing the app) if it's absent. We do NOT use passkeys —
    only email/password + recovery OTP — but this script must load
    SYNCHRONOUSLY before flutter_bootstrap.js so that global exists when the
    Flutter web loader registers plugins. Vendored locally (web/) instead of
    hot-linking the GitHub release for reliability/offline boots.
  -->
  <script src="passkeys_bundle.js"></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
